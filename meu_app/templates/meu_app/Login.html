{% load static %}<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Bzu Cloud</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'meu_app/css/Login.css' %}">
</head>
<body>
  <main class="page">

    <!-- Lado esquerdo -->
    <section class="brand">
      <div class="brand-content">
        <div class="logo">
          <span class="logo-text">Bzu</span>
          <span class="logo-tech">TECH</span>
        </div>

        <h1>Olá, faça seu login<br>na Simulador Cloud</h1>

        <p>
          Sistema completo de <strong>monitoramento e gestão de equipamentos em tempo real.</strong>
        </p>
      </div>
    </section>

    <!-- Lado direito -->
    <section class="login">
      <form class="card" id="loginForm" method="post" action="{% url 'login' %}" autocomplete="on">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <h2>Login Simulador Cloud</h2>

        {% if erro %}
        <p class="form-erro" role="alert">{{ erro }}</p>
        {% endif %}

        <label class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
          </svg>
          <input type="email" id="email" name="email" placeholder="Email" value="{{ email|default:'' }}" required>
        </label>

        <label class="field">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="11" rx="2"/>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
            <circle cx="12" cy="15.5" r="1" fill="currentColor"/>
          </svg>
          <input type="password" id="senha" name="senha" placeholder="Senha" required>
          <button type="button" class="toggle" id="toggleSenha" aria-label="Mostrar ou ocultar senha">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/>
              <path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
              <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </label>

        <button type="submit" class="btn" id="btnEntrar" disabled>Entrar</button>
      </form>

      <p class="forgot">Esqueceu a senha? <a href="#">Recuperar</a></p>
    </section>

  </main>

  <script>
    const email = document.getElementById('email');
    const senha = document.getElementById('senha');
    const btn = document.getElementById('btnEntrar');
    const toggle = document.getElementById('toggleSenha');

    // Habilita o botão só quando os dois campos estão preenchidos
    function validar() {
      btn.disabled = !(email.value.trim() && senha.value.trim());
    }
    email.addEventListener('input', validar);
    senha.addEventListener('input', validar);
    validar();

    // Mostrar / ocultar senha
    toggle.addEventListener('click', () => {
      senha.type = senha.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
